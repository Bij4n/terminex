[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminex"
version = "0.4.0"
description = "Terminal dashboard for live FX, crypto, and commodity prices"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["terminal", "tui", "forex", "crypto", "commodities", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Terminals",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
terminex = "terminex.app:main"

[project.urls]
Homepage = "https://github.com/johnd/terminex"
Issues = "https://github.com/johnd/terminex/issues"

[tool.setuptools.packages.find]
include = ["terminex*"]
exclude = ["tests*"]
