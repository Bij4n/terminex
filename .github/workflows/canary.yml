name: canary

# Checks every live data feed once a day and keeps one GitHub issue open per
# failing feed (label: canary), closing it when the feed recovers. A feed that
# is only rate limited from the runner's shared address is noted in the job
# summary, not filed as an issue. See scripts/canary.py.

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Report this feed as failing to test the issue flow (e.g. coingecko.com)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

# A manual run overlapping the scheduled one must not open duplicate issues.
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install terminex
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check every feed against its live API
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINEX_COINCAP_KEY: ${{ secrets.TERMINEX_COINCAP_KEY }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          python scripts/canary.py --manage-issues \
            --summary "$GITHUB_STEP_SUMMARY" \
            --simulate-failure "$SIMULATE_FAILURE"
